{% extends "base.html" %}

{% block title %}Oops! - TeamSync{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-center" style="min-height: 80vh;">
    <div class="glass-panel p-5 text-center animate__animated animate__pulse" style="max-width: 500px;">
        <div class="mb-4 text-warning">
            <i class="bi bi-cone-striped fs-1"></i>
        </div>
        <h1 class="fw-bold text-white mb-3">Something went wrong</h1>
        <p class="text-muted mb-4 lead">
            We encountered an unexpected error while processing your request.
        </p>

        <div class="bg-black bg-opacity-25 rounded p-3 mb-4 text-start font-monospace small text-danger overflow-auto"
            style="max-height: 150px;">
            {{ error_detail or 'Internal Server Error' }}
        </div>

        <div class="d-flex gap-3 justify-content-center">
            <a href="/" class="btn btn-outline-light rounded-pill px-4">
                <i class="bi bi-house-door me-2"></i>Dashboard
            </a>
            <button onclick="window.location.reload()" class="btn btn-neon rounded-pill px-4">
                <i class="bi bi-arrow-clockwise me-2"></i>Retry
            </button>
        </div>
    </div>
</div>
{% endblock %}
